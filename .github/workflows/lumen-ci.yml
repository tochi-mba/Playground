# Build, lint and test lumen (the Rust projection-mapping app under lumen/).
# Every job is path-filtered to lumen/, so Android changes never trigger it.
# The Linux test job installs Mesa's lavapipe so the wgpu renderer is compared against the
# software oracle headlessly; the Windows jobs prove the app and the Spout feature build there.
name: Build lumen

on:
  push:
    paths:
      - "lumen/**"
      - ".github/workflows/lumen-ci.yml"
  pull_request:
    paths:
      - "lumen/**"
      - ".github/workflows/lumen-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: lumen

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: lumen/Cargo.toml
          command: check

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install a software Vulkan driver (lavapipe)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libegl1
      - name: Unit, integration and golden tests
        run: cargo nextest run --workspace --all-features --no-fail-fast
        env:
          # Linux must prove the GPU path; Windows runners have no GPU, so the GPU tests skip
          # themselves there and the software oracle still runs.
          LUMEN_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
          WGPU_BACKEND: ${{ runner.os == 'Linux' && 'vulkan' || '' }}
      - name: Doc tests
        run: cargo test --workspace --all-features --doc
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            lumen/tests/golden/*.actual.png
            lumen/tests/golden/*.diff.png

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libegl1
      - name: Measure
        run: cargo llvm-cov nextest --workspace --all-features --json --summary-only --output-path coverage.json
        env:
          LUMEN_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
      - name: Enforce floors (85% workspace, 95% lumen-core)
        run: cargo run -q -p xtask -- check-coverage coverage.json | tee -a "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - run: cargo check --workspace --all-features --locked
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  build-windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - run: cargo build --release -p lumen-app --features spout
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-x64
          if-no-files-found: error
          path: lumen/target/release/lumen.exe
      - name: Summary
        shell: bash
        run: |
          {
            echo "### lumen build ${{ github.run_id }}"
            echo
            echo "Download the **lumen-windows-x64** artifact for a portable \`lumen.exe\`."
          } >> "$GITHUB_STEP_SUMMARY"
