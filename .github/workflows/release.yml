# Publishes installable APKs as GitHub Releases.
#   push to main      -> release vMAJOR.MINOR.<run number>, marked Latest
#   push tag v*       -> release with that exact version
#   workflow_dispatch -> pre-release build-<run number> from any branch (for trying a branch)
# The debug and androidTest APKs ride along so the phone harness can fetch a build from a release too.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "mobile-harness/**"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_MAJOR_MINOR: "0.1"

defaults:
  run:
    working-directory: mobile-harness

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile-harness

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"; name="${tag#v}"; prerelease=false
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            name="${VERSION_MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"; tag="v${name}"; prerelease=false
          else
            name="${VERSION_MAJOR_MINOR}.${GITHUB_RUN_NUMBER}-${GITHUB_REF_NAME//\//-}"; tag="build-${GITHUB_RUN_NUMBER}"; prerelease=true
          fi
          {
            echo "name=$name"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version $name, tag $tag, prerelease=$prerelease"

      - name: Restore release signing key (only if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "using release keystore from secrets"
          else
            echo "no release keystore secret; signing with the shared debug key"
          fi

      - name: Build APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Collect artifacts
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/playground-${NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/playground-${NAME}-debug.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "dist/playground-${NAME}-androidTest.apk"
          (cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Playground ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: mobile-harness/dist/*
          fail_on_unmatched_files: true

      - name: Summary
        env:
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Published Playground $NAME"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
