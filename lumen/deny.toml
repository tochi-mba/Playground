# cargo-deny policy for lumen. Run `cargo deny check` from this folder.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are an error only when this workspace depends on them directly.
# Transitive ones (today: ttf-parser via egui's font stack, RUSTSEC-2026-0192) are upstream's
# call; `cargo deny check advisories` still lists them as warnings so they stay visible.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Permissive licences only. GPL/AGPL/LGPL code must not enter the dependency graph because
# the application ships under MIT OR Apache-2.0.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version because nothing here is published.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # Pulls in a copyleft licence and a huge native build.
  { crate = "ffmpeg-sys-next", reason = "video decoding is a separate feature with its own review" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
