[package]
name = "lumen-sources"
description = "Frame sources for lumen: test patterns, solid colours, images and Spout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Receive live textures from Spout senders. Native on Windows (MSVC, x64) through the
# vendored Spout2 SDK; compiles to a no-op stub elsewhere so the app and tests behave the same.
spout = ["dep:spout2-rs"]

[dependencies]
lumen-core.workspace = true
image.workspace = true
thiserror.workspace = true
log.workspace = true
spout2-rs = { version = "0.1.1", default-features = false, features = ["dx"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
