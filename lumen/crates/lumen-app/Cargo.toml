[package]
name = "lumen-app"
description = "lumen: projection mapping editor, show player and headless CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[features]
default = []
# Spout receiver (Windows). Forwarded to lumen-sources.
spout = ["lumen-sources/spout"]

[dependencies]
lumen-core.workspace = true
lumen-render.workspace = true
lumen-sources.workspace = true
lumen-control.workspace = true
wgpu.workspace = true
winit.workspace = true
eframe.workspace = true
egui.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
image.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
